[package]
name = "fineshell"
version = "0.1.16"
description = "A cross-platform SSH and SFTP client for terminal access, file management, and server monitoring."
authors = ["Max"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fineshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
fast-socks5 = "1.0.0"
futures-util = "0.3.31"
keyring = "4.1.5"
log = "0.4"
notify = "8.2.0"
regex = "1.11.1"
httparse = "1.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rig-core = { version = "0.40.0", default-features = false, features = ["reqwest", "rustls"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-socks = "0.5.3"
time = { version = "0.3", features = ["formatting"] }
vte = "0.15.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ssh2 = "0.9.6"
