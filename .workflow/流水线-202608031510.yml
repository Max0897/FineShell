version: "1.0"
name: fineshell-release
displayName: FineShell 发布

triggers:
  push:
    autoCancel: false
    timeout: 2h
    branches:
      include:
        - gitee-release-trigger

variables:
  GITEE_ACCESS_TOKEN: ${{GITEE_ACCESS_TOKEN}}

stages:
  - stage:
    name: publish
    displayName: 发布 Gitee Release
    steps:
      - step: build@python
        name: publish-release
        displayName: 同步安装包并更新 OTA
        commands:
          - bash scripts/gitee-pipeline-release.sh
