version: "1.0"
name: fineshell-release
displayName: FineShell 发布

triggers:
  push:
    autoCancel: false
    timeout: 2h
    branches:
      include:
        - gitee-release-trigger

variables:
  FINESHELL_RELEASE_TOKEN: ${{FINESHELL_RELEASE_TOKEN}}

stages:
  - stage:
    name: publish
    displayName: 发布 Gitee Release
    steps:
      - step: build@python
        name: publish-release
        displayName: 同步安装包并更新 OTA
        pythonVersion: "3.11"
        commands:
          - bash scripts/gitee-pipeline-release.sh
