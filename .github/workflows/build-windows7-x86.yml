name: Build Windows 7 x86 Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-windows7-x86.yml
      - scripts/build-windows7-x86.ps1

permissions:
  contents: read

concurrency:
  group: windows7-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows 7 x86 setup
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install native build tools
        shell: pwsh
        run: |
          choco install strawberryperl nasm --yes --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build compatibility installer
        shell: pwsh
        run: ./scripts/build-windows7-x86.ps1 -NoSign

      - name: Upload compatibility installer
        uses: actions/upload-artifact@v4
        with:
          name: FineShell-windows7-x86-setup
          path: src-tauri/target/win7-x86/dist/*.exe
          if-no-files-found: error
          retention-days: 14
