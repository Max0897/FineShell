name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "版本标签，例如 v0.1.0（必须与应用版本一致）"
        required: true
        type: string
      sync_gitee_only:
        description: "仅重新触发 Gitee 发布流水线"
        default: false
        required: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Require manual releases from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual releases must run from main." >&2
          exit 1
      - name: Verify release commit belongs to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        name: Validate application version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          bun scripts/check-release-version.ts "$RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Validate release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: bun scripts/extract-release-notes.ts "$RELEASE_TAG" > /tmp/release-notes.md

  prepare:
    name: Prepare draft release
    needs: validate
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sync_gitee_only) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - id: release
        name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi

          release_id="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              -F tag_name="$RELEASE_TAG" \
              -F target_commitish="$GITHUB_SHA" \
              -F name="FineShell $RELEASE_TAG" \
              -F body="" \
              -F draft=true \
              -F prerelease="$prerelease" \
              --jq '.id'
          )"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs:
      - validate
      - prepare
    permissions:
      contents: write
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sync_gitee_only) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rustTargets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            appleSigningIdentity: "-"
          - name: macOS Intel
            platform: macos-15-intel
            rustTargets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            appleSigningIdentity: "-"
          - name: Linux x64
            platform: ubuntu-22.04
            rustTargets: ""
            args: --bundles deb
            appleSigningIdentity: ""
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            rustTargets: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles deb
            appleSigningIdentity: ""
          - name: Windows x64
            platform: windows-latest
            rustTargets: ""
            args: --bundles nsis,msi
            appleSigningIdentity: ""
          - name: Windows ARM64
            platform: windows-11-arm
            rustTargets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
            appleSigningIdentity: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - id: release_notes
        name: Prepare updater release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          delimiter="FINESHELL_RELEASE_NOTES_${RANDOM}_${RANDOM}_${RANDOM}"
          echo "body<<$delimiter" >> "$GITHUB_OUTPUT"
          bun scripts/extract-release-notes.ts "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build installers and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.appleSigningIdentity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.args }}
          generateReleaseNotes: false
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-') }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          releaseName: FineShell ${{ needs.validate.outputs.release_tag }}
          retryAttempts: 2
          tagName: ${{ needs.validate.outputs.release_tag }}
          tauriScript: bun tauri
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
      - name: Verify macOS binary dependencies
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rustTargets }}
        run: |
          # Tauri removes the temporary .app after creating the DMG, while the
          # linked release executable remains available for dependency checks.
          binary="src-tauri/target/$RUST_TARGET/release/fineshell"
          if [[ ! -x "$binary" ]]; then
            echo "macOS application binary not found: $binary" >&2
            exit 1
          fi

          otool -L "$binary"
          unexpected_dependencies="$(
            otool -L "$binary" \
              | tail -n +2 \
              | awk '{ print $1 }' \
              | awk '!/^\/System\// && !/^\/usr\/lib\// && !/^@rpath\// && !/^@loader_path\// && !/^@executable_path\// { print }'
          )"
          if [[ -n "$unexpected_dependencies" ]]; then
            echo "macOS binary contains non-system absolute dependencies:" >&2
            echo "$unexpected_dependencies" >&2
            exit 1
          fi

  publish:
    name: Publish release
    needs:
      - validate
      - build
    permissions:
      contents: write
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sync_gitee_only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Download updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "$RELEASE_TAG" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/updater"
          release_id="$(
            gh release view "$RELEASE_TAG" \
              --json databaseId \
              --jq '.databaseId'
          )"
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/updater/release.json"
      - name: Normalize updater download URLs
        run: |
          bun scripts/normalize-updater-manifest.ts \
            "$RUNNER_TEMP/updater/latest.json" \
            "$RUNNER_TEMP/updater/release.json" \
            "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      - name: Validate updater manifest
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: bun scripts/validate-updater-manifest.ts "$RUNNER_TEMP/updater/latest.json" "$RELEASE_TAG"
      - name: Upload normalized updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/updater/latest.json" --clobber
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: bun scripts/extract-release-notes.ts "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false

  trigger-gitee-release:
    name: Trigger Gitee release pipeline
    needs:
      - validate
      - publish
    permissions:
      contents: read
    if: ${{ always() && needs.validate.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.sync_gitee_only)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Gitee mirror credentials
        shell: bash
        env:
          GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          test -n "$GITEE_KNOWN_HOSTS" || {
            echo "GITEE_KNOWN_HOSTS is not configured." >&2
            exit 1
          }
          test -n "$GITEE_SSH_PRIVATE_KEY" || {
            echo "GITEE_SSH_PRIVATE_KEY is not configured." >&2
            exit 1
          }
      - name: Configure Gitee SSH access
        shell: bash
        env:
          GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$GITEE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Sync release tag to Gitee
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
          git remote add gitee git@gitee.com:Max0897/FineShell.git
          git push gitee "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Push Gitee pipeline trigger
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          trigger_directory="$RUNNER_TEMP/gitee-release-trigger"
          git clone --no-hardlinks --no-checkout . "$trigger_directory"
          # The trigger branch must contain the latest pipeline definition even
          # when an older release is retried from main.
          git -C "$trigger_directory" checkout --detach "$GITHUB_SHA"
          git -C "$trigger_directory" switch -C gitee-release-trigger
          git -C "$trigger_directory" remote add gitee \
            git@gitee.com:Max0897/FineShell.git

          cat > "$trigger_directory/.gitee-release-trigger.json" <<EOF
          {
            "tag": "$RELEASE_TAG",
            "commit": "$release_commit",
            "github_repository": "$GITHUB_REPOSITORY",
            "run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT"
          }
          EOF

          git -C "$trigger_directory" config user.name "FineShell Release"
          git -C "$trigger_directory" config user.email "actions@github.com"
          git -C "$trigger_directory" add .gitee-release-trigger.json
          git -C "$trigger_directory" commit \
            --allow-empty \
            -m "触发 $RELEASE_TAG Gitee 发布流水线"
          git -C "$trigger_directory" push \
            --force \
            gitee \
            HEAD:refs/heads/gitee-release-trigger
